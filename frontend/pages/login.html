<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Campaign Flux</title>
    <link
      rel="stylesheet"
      href="../styles.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-screen bg-white text-gray-900 dark:bg-slate-900 dark:text-slate-200"
  >
    <div
      id="root"
      class="flex min-h-screen flex-col"
    >
      <app-navbar></app-navbar>
      <div
        class="flex flex-1 pt-16 overflow-hidden"
        id="data-sidebar"
      >
        <main
          id="main-page"
          class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 p-6 h-[calc(100vh-4rem)]"
        >
          <div class="flex flex-1">
            <main
              id="login-main"
              class="flex-1 flex items-center justify-center bg-neutral-primary-soft p-6"
            >
              <div class="w-full max-w-md">
                <div class="text-center mb-8">
                  <div class="flex items-center justify-center gap-3 mb-4">
                    <img
                      src="../public/crm.png"
                      alt="CRM Logo"
                      class="h-12"
                    />
                    <h1 class="text-3xl font-bold text-heading">
                      Campaign Flux
                    </h1>
                  </div>
                  <p class="text-body text-sm">
                    Welcome back! Please login to your account
                  </p>
                </div>

                <form
                  id="login-form"
                  class="bg-white dark:bg-slate-800 rounded-lg shadow-md p-8 space-y-6"
                >
                  <div>
                    <label
                      for="login-email"
                      class="block mb-2.5 text-sm font-medium text-heading"
                    >
                      Email Address
                    </label>
                    <input
                      type="email"
                      id="login-email"
                      name="email"
                      class="w-full bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-2 focus:ring-brand focus:border-brand block px-4 py-2.5 shadow-xs placeholder:text-body transition duration-200"
                      placeholder="you@example.com"
                      required
                    />
                    <p
                      id="email-error"
                      class="text-red-600 text-xs mt-1 hidden"
                    ></p>
                  </div>

                  <div>
                    <label
                      for="login-password"
                      class="block mb-2.5 text-sm font-medium text-heading"
                    >
                      Password
                    </label>
                    <input
                      type="password"
                      id="login-password"
                      name="password"
                      class="w-full bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-2 focus:ring-brand focus:border-brand block px-4 py-2.5 shadow-xs placeholder:text-body transition duration-200"
                      placeholder="••••••••"
                      required
                    />
                    <p
                      id="password-error"
                      class="text-red-600 text-xs mt-1 hidden"
                    ></p>
                  </div>
                  <div class="items-center w-full justify-center flex">
                    <button
                      type="submit"
                      id="login-submit"
                      class="px-10 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 rounded-lg shadow transition-colors self-center"
                    >
                      Sign In
                    </button>
                  </div>
                  <p
                    id="form-error"
                    class="text-red-600 text-sm text-center hidden"
                  ></p>

                  <div
                    class="text-center pt-4 border-t border-gray-200 dark:border-gray-700"
                  >
                    <p class="text-sm text-body">
                      Don't have an account?
                      <a
                        href="/signup"
                        class="text-brand hover:underline font-medium cursor-pointer"
                        >Create new organization</a
                      >
                    </p>
                  </div>
                </form>
              </div>
            </main>
          </div>
        </main>
      </div>
    </div>

    <!-- LOGIN SCRIPT -->
    <script
      type="module"
      src="../js/login.js"
      defer
    ></script>

    <!-- COMPONENTS IMPORT -->
    <script
      type="module"
      src="../components/appNavbar.js"
    ></script>

    <!-- MAIN INDEX IMPORT -->
    <script
      type="module"
      src="../index.js"
    ></script>

    <!-- ROUTING IMPORT -->
    <script
      type="module"
      src="../router.js"
      defer
    ></script>
  </body>
</html>
