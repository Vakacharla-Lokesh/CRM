<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Campaign Flux</title>
    <link
      rel="stylesheet"
      href="../styles.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-screen bg-white text-gray-900 dark:bg-slate-900 dark:text-slate-200"
  >
    <div
      id="root"
      class="flex min-h-screen flex-col"
    >
      <app-navbar></app-navbar>
      <div
        class="flex flex-1 pt-16 overflow-hidden"
        id="data-sidebar"
      >
        <app-sidebar></app-sidebar>
        <main
          id="main-page"
          class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 p-6 h-[calc(100vh-4rem)]"
        >
          <div class="w-full h-full">
            <div class="flex flex-row justify-between items-center pb-6">
              <div>
                <h2
                  class="text-2xl font-semibold text-gray-900 dark:text-white"
                >
                  Leads
                </h2>
              </div>
              <div class="flex gap-2">
                <button
                  type="button"
                  id="bulk-delete-leads"
                  style="display: none"
                  class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600 rounded-lg transition-colors items-center gap-2"
                >
                  <svg
                    class="w-4 h-4 inline-block"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                    />
                  </svg>
                  Delete Selected
                </button>

                <button
                  type="button"
                  id="calculate-score"
                  class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors"
                >
                  Calculate Score
                </button>
                <div id="export">
                  <button
                    type="button"
                    id="export-leads"
                    class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors"
                  >
                    Export
                  </button>
                </div>
                <button
                  type="button"
                  id="open-modal-btn"
                  class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 rounded-lg shadow transition-colors"
                >
                  Add Lead +
                </button>
              </div>
            </div>

            <div class="w-full flex flex-row items-center gap-x-4">
              <div class="flex-2">
                <search-bar data-search-type="leads-search-input"></search-bar>
              </div>
              <smart-filter></smart-filter>
            </div>

            <!-- Table Section -->
            <div
              class="relative overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-sm min-h-75vh"
            >
              <table
                id="leads-table"
                class="w-full text-sm text-left"
              >
                <thead
                  class="sticky top-0 z-10 bg-gray-50 dark:bg-gray-700 text-xs font-semibold uppercase text-gray-600 dark:text-gray-300 border-b border-gray-200 dark:border-gray-600"
                >
                  <tr>
                    <th
                      scope="col"
                      class="p-4"
                    >
                      <input
                        type="checkbox"
                        id="select-all-leads"
                        class="w-4 h-4 text-blue-600 bg-gray-100 dark:bg-gray-600 border-gray-300 dark:border-gray-500 rounded focus:ring-blue-500 dark:focus:ring-blue-600 focus:ring-2"
                      />
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Lead Name
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Organization
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Email
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Mobile
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Status
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Score
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3"
                    >
                      Created
                    </th>
                    <th
                      scope="col"
                      class="px-3 py-3"
                    >
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody id="leads-body"></tbody>
              </table>
            </div>
          </div>

          <lead-modal></lead-modal>
        </main>
      </div>
    </div>

    <!-- COMPONENTS IMPORT -->
    <script
      type="module"
      src="../components/appNavbar.js"
    ></script>
    <script
      type="module"
      src="../components/appSidebar.js"
    ></script>
    <script
      src="../components/exportProgress.js"
      defer
    ></script>

    <!-- LEAD MODAL IMPORT -->
    <script
      src="../components/modals/leadModal.js"
      type="module"
      defer
    ></script>
    
    <!-- SEARCH BAR IMPORT -->
    <script
      src="../js/searchFeatures.js"
      type="module"
      defer
    ></script>
    <script
      type="module"
      src="../components/filter.js"
    ></script>

    <!-- MAIN INDEX IMPORT -->
    <script
      type="module"
      src="../index.js"
    ></script>
    <!-- ROUTING IMPORT -->
    <script
      type="module"
      src="../router.js"
      defer
    ></script>
  </body>
</html>
