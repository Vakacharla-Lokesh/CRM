<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Campaign Flux</title>
    <link
      rel="stylesheet"
      href="../styles.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="min-h-screen bg-white text-gray-900 dark:bg-slate-900 dark:text-slate-200"
  >
    <div
      id="root"
      class="flex min-h-screen flex-col"
    >
      <app-navbar></app-navbar>
      <div
        class="flex flex-1 pt-16 overflow-hidden"
        id="data-sidebar"
      >
        <app-sidebar></app-sidebar>
        <main
          id="main-page"
          class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 p-6 h-[calc(100vh-4rem)]"
        >
          <div style="text-align: center">
            <h1>404 Not Found</h1>
            <p>
              Oh no! It looks like the page you're trying to get to is missing!
            </p>
          </div>
        </main>
      </div>
    </div>

    <!-- COMPONENTS IMPORT -->
    <script
      type="module"
      src="../components/appNavbar.js"
    ></script>
    <script
      type="module"
      src="../components/appSidebar.js"
    ></script>
    <!-- MAIN INDEX IMPORT -->
    <script
      type="module"
      src="../index.js"
    ></script>
    <!-- ROUTING IMPORT -->
    <script
      type="module"
      src="../router.js"
      defer
    ></script>
  </body>
</html>
